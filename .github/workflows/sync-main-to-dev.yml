name: Sync main -> dev

# After every push to `main` (typically: a `dev → main` PR landed, OR the
# changesets bot's "Version Packages" PR auto-merged and `release.yml`
# pushed version bumps + tags), back-merge `main` into `dev` so the
# integration branch never falls behind.
#
# Strategy (OPS2, 2026-06):
#   `dev` is a PROTECTED branch — a direct / fast-forward push is rejected
#   ("GH006: protected branch update failed"), which used to fail this job on
#   every release. So we NEVER push to `dev`. Instead:
#     1. Skip if `dev` already contains `main` (in sync, or just extra merge
#        nodes from prior syncs).
#     2. Otherwise force `main` onto a stable `chore/sync-main-to-dev` branch,
#        open (or refresh) a PR into `dev`, and enable GitHub **auto-merge** so
#        it lands automatically once required checks pass.
#
# FULLY hands-off requires one repo setting: `dev` currently requires **1
# approving review**, so the auto-merge PR waits for an approval. To make sync
# completely automatic, relax `dev`'s review requirement (it's the integration
# branch; `main` is the real gate) OR have a reviewer/auto-approve rule. See
# RELEASING.md.
#
# Token cascade: set `RELEASE_BOT_TOKEN` (same PAT as `release.yml`) so the
# sync PR triggers CI on `dev` (a `GITHUB_TOKEN`-opened PR does not). Falls
# back to `GITHUB_TOKEN` when unset.

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab if a previous run failed and
  # you want to retry without pushing a new commit to main.
  workflow_dispatch:

# Only one sync attempt at a time per ref. Cancel in-flight runs when
# a newer push lands so we always sync the latest main tip.
concurrency:
  group: sync-main-to-dev
  cancel-in-progress: true

# Top-level read-only; the single job below escalates only what it needs.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  sync:
    name: Fast-forward dev or open PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write       # push to dev (fast-forward path) + create branch (PR fallback)
      pull-requests: write  # open the fallback PR
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Need full history so the fast-forward attempt and PR diff
          # both have all commits available locally.
          fetch-depth: 0
          # Check out main; we'll branch from here for the PR fallback.
          ref: main
          # Same PAT as `release.yml` when set — unblocks CI on bot-opened
          # sync PRs and ensures `git push` uses non-`GITHUB_TOKEN` auth.
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Open/refresh sync PR + enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin dev:dev
          MAIN_SHA=$(git rev-parse main)
          DEV_SHA=$(git rev-parse dev)
          echo "main=${MAIN_SHA} dev=${DEV_SHA}"

          if [ "${MAIN_SHA}" = "${DEV_SHA}" ]; then
            echo "dev is already at main — nothing to sync."
            echo "### Sync: no-op (dev == main)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # If main is already an ancestor of dev, dev contains all of main's
          # content (it just has extra merge nodes from prior syncs) — skip.
          if git merge-base --is-ancestor "${MAIN_SHA}" "${DEV_SHA}"; then
            echo "dev already contains main — nothing to sync."
            echo "### Sync: no-op (dev already contains main)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # dev is protected (no direct push). Carry main onto a STABLE sync
          # branch (force-push keeps its head at the latest main) and open or
          # refresh one PR into dev.
          BRANCH="chore/sync-main-to-dev"
          git push -f origin "main:refs/heads/${BRANCH}"

          # Only an OPEN PR counts — `gh pr view` also matches a previously
          # MERGED sync PR on this stable branch, which would wrongly skip
          # creating the next one and strand dev behind.
          open_pr() { gh pr list --head "${BRANCH}" --base dev --state open --json number --jq '.[0].number // empty'; }
          OPEN_PR=$(open_pr)
          if [ -n "${OPEN_PR}" ]; then
            echo "Sync PR #${OPEN_PR} already open; force-push refreshed it."
          else
            BODY=$(printf '%s\n' \
              'Auto-generated back-merge of `main` into `dev` after a push to `main` (release or merge).' \
              '' \
              'Auto-merge is enabled — this lands automatically once required checks pass.' \
              '**`dev` requires 1 approving review**, so approve to complete (or relax dev''s' \
              'review requirement so sync is fully hands-off; see RELEASING.md).' \
              '' \
              'Generated by `.github/workflows/sync-main-to-dev.yml`.')
            gh pr create --base dev --head "${BRANCH}" \
              --title "chore(sync): main -> dev" --body "${BODY}" \
              || echo "::notice::Sync PR create skipped (may already exist)."
            OPEN_PR=$(open_pr)
          fi

          # Queue native auto-merge (idempotent). Completes once required checks
          # pass AND dev's review requirement is satisfied.
          if [ -n "${OPEN_PR}" ]; then
            gh pr merge "${OPEN_PR}" --auto --merge \
              || echo "::notice::auto-merge not enabled yet (needs review / repo settings)."
          fi

          {
            echo "### Sync PR queued for auto-merge"
            echo ""
            echo "Opened/refreshed \`chore(sync): main -> dev\` and enabled auto-merge."
            echo "Completes once required checks pass and \`dev\`'s review requirement is met."
          } >> "${GITHUB_STEP_SUMMARY}"
