# Optional benchmark harness — does not gate PRs. See BENCHMARKS.md.
name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-pnpm-node
      - name: Run Vitest benchmarks (@ziro-agent/core)
        run: pnpm bench
